{% extends 'base.html' %}
{% block title %}Add New Need{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header border-0 bg-transparent">
                <h2 class="text-center fw-bold h2 my-4 gradient-text-blue">Add a New Need</h2>
            </div>
            <div class="card-body p-4 p-md-5">
                <form action="{{ url_for('add_item') }}" method="POST" class="needs-validation" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="item_name" class="form-label">Item Name</label>
                        <input type="text" name="item_name" id="item_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <input type="text" name="category" id="category" class="form-control" required placeholder="e.g. Food, Clothing, School Supplies">
                    </div>
                    <div class="mb-3">
                        <label for="quantity_needed" class="form-label">Quantity Needed</label>
                        <input type="number" name="quantity_needed" id="quantity_needed" class="form-control" required min="1">
                    </div>
                    <div class="form-check mb-4">
                        <input id="is_urgent" name="is_urgent" type="checkbox" class="form-check-input">
                        <label for="is_urgent" class="form-check-label">This is urgent</label>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary-blue btn-lg rounded-pill">Add Need to Dashboard</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
