{% extends 'base.html' %}
{% block title %}Post an Update{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header border-0 bg-transparent">
                <h2 class="text-center fw-bold h2 my-4 gradient-text-blue">Post an Update or Thank You</h2>
                <p class="text-center text-muted mb-0">Donors love to see these!</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form action="{{ url_for('add_update') }}" method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" name="title" id="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="body" class="form-label">Body</label>
                        <textarea name="body" id="body" rows="5" class="form-control" required placeholder="e.g. A huge thank you to Hardik for the donation of 20 blankets..."></textarea>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary-blue btn-lg rounded-pill">Post Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
